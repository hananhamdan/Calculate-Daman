<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الراتب المستحق المتوقع بعد التقاعد</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: linear-gradient(#96f7b3, #70b3f1);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            overflow-x: hidden;
        }

        .container {
            background-color: white;

            width: 100%;
            max-width: 420px;

            padding: 25px;

            border-radius: 20px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;

            color: #222;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        input,
        select,
        button {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 10px;
            border: 1px solid #ccc;

            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #28a745;
        }

        button {
            background-color: #28a745;

            color: white;

            border: none;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        h3 {
            text-align: center;

            margin-top: 15px;

            line-height: 1.8;
        }

        #result {
            color: #28a745;

            font-weight: bold;

            display: block;

            margin-top: 10px;

            font-size: 22px;
        }

        @media screen and (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
                border-radius: 16px;
            }

            h2 {
                font-size: 22px;
            }

            input,
            select,
            button {
                font-size: 15px;
                padding: 12px;
            }

            #result {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>حاسبة الراتب المتوقع بعد التقاعد</h2>

        <label for="salary1">الراتب الأساسي للسنة الأولى</label>
        <input type="number" id="salary1" placeholder="أدخل الراتب للسنة الأولى">

        <label for="salary2">الراتب الأساسي للسنة الثانية</label>
        <input type="number" id="salary2" placeholder="أدخل الراتب للسنة الثانية">

        <label for="salary3">الراتب الأساسي للسنة الثالثة</label>
        <input type="number" id="salary3" placeholder="أدخل الراتب للسنة الثالثة">

        <label for="years">عدد سنوات الخدمة</label>
        <input type="number" id="years" placeholder="أدخل عدد سنوات الخدمة">

        <label for="education">المؤهل العلمي</label>

        <select id="education">
            <option value="0">دبلوم</option>
            <option value="1">بكالوريوس</option>
            <option value="2">ماجستير</option>
            <option value="3">دكتوراه</option>
        </select>

        <button onclick="calculate()">
            احتساب الراتب التقاعدي
        </button>

        <h3>
            الراتب التقاعدي المستحق:
            <span id="result">--</span>
        </h3>

    </div>

    <script>

        function calculate() {

            let salary1 = parseFloat(document.getElementById("salary1").value) || 0;

            let salary2 = parseFloat(document.getElementById("salary2").value) || 0;

            let salary3 = parseFloat(document.getElementById("salary3").value) || 0;

            let years = parseFloat(document.getElementById("years").value) || 0;

            let education = parseInt(document.getElementById("education").value);

            // متوسط الرواتب
            let totalSalary = (salary1 + salary2 + salary3) / 3;

            // الراتب التقاعدي الأساسي
            let retirementSalary = totalSalary * years * 0.025;

            // نسبة الزيادة
            let percentageIncrease = 0;

            if (education === 1) {
                percentageIncrease = 4;
            }

            else if (education === 2) {
                percentageIncrease = 6;
            }

            else if (education === 3) {
                percentageIncrease = 8;
            }

            // الراتب النهائي
            let finalSalary =
                retirementSalary +
                (retirementSalary * percentageIncrease / 100);

            document.getElementById("result").innerText =
                finalSalary.toFixed(2) + " د.أ";

        }

    </script>

</body>

</html>
