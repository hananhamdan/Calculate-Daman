<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الضمان</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image:linear-gradient( #96f7b3 , #70b3f1) ;

            text-align: center;
            padding: 20px;

        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin: auto;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: rgb(238, 247, 248);
            border: none;
            cursor: pointer;
        }
        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>حاسبة الضمان</h2>
        <label for="salary1">الراتب الأساسي للسنة الأولى</label>
        <input type="number" id="salary1" placeholder="أدخل الراتب للسنة الأولى" />

        <label for="salary2">الراتب الأساسي للسنة الثانية</label>
        <input type="number" id="salary2" placeholder="أدخل الراتب للسنة الثانية" />

        <label for="salary3">الراتب الأساسي للسنة الثالثة</label>
        <input type="number" id="salary3" placeholder="أدخل الراتب للسنة الثالثة" />

        <label for="years">عدد سنوات الخدمة</label>
        <input type="number" id="years" placeholder="أدخل عدد سنوات الخدمة" />

        <label for="education">المؤهل العلمي</label>
        <select id="education">
            <option value="0">دبلوم</option>
            <option value="1">بكالوريوس</option>
            <option value="2">ماجستير</option>
            <option value="3">دكتوراه</option>
        </select>

        <button onclick="calculate()">احتساب الراتب التقاعدي</button>

        <h3>الراتب التقاعدي المستحق: <span id="result">--</span></h3>
    </div>

    <script>
        function calculate() {
            var salary1 = parseFloat(document.getElementById("salary1").value);
            var salary2 = parseFloat(document.getElementById("salary2").value);
            var salary3 = parseFloat(document.getElementById("salary3").value);
            var years = parseFloat(document.getElementById("years").value);
            var education = parseInt(document.getElementById("education").value);

            // حساب المتوسط
            var totalSalary = (salary1 * 12 + salary2 * 12 + salary3 * 12);
            var averageSalary = totalSalary / 36;

            // حساب الراتب التقاعدي بناءً على سنوات الخدمة والنسبة
            var retirementSalary = averageSalary * years * 0.025;

            // إضافة النسبة بناءً على المؤهل العلمي
            var percentageIncrease = 0;
            if (education === 1) {
                percentageIncrease = 4; // بكالوريوس
            } else if (education === 2) {
                percentageIncrease = 6; // ماجستير
            } else if (education === 3) {
                percentageIncrease = 8; // دكتوراه
            }

            // حساب الزيادة بناءً على النسبة المئوية
            var increase = retirementSalary * (percentageIncrease / 100);

            // حساب الراتب النهائي
            var finalSalary = retirementSalary + increase;

            document.getElementById("result").innerText = finalSalary.toFixed(2);
        }
    </script>
</body>
</html>
